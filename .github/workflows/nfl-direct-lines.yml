name: NFL direct book lines (FanDuel, DraftKings; no Odds API)

# Pulls game lines and player props straight from FanDuel's and DraftKings' public web JSON (pregame/sportsbooks.py).
# No API key and no Odds API credits. Unofficial feeds: a run records what each book returned, and a failed book is
# listed as failed. Commits pregame/direct_lines/.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Keep truncated raw responses (for checking the parser)"
        required: false
        default: "false"
  push:
    paths: ["pregame/sportsbooks.py", ".github/workflows/nfl-direct-lines.yml"]
  schedule:
    - cron: "0 15 * * 2,4,6"     # Tue/Thu/Sat ~10 AM ET
    - cron: "15 * * * 0,1,4"     # hourly on game days (GitHub may start these late)

permissions:
  contents: write

concurrency:
  group: nfl-direct-lines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull FanDuel and DraftKings lines
        run: |
          args=()
          if [ "${{ inputs.probe }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then args+=(--probe); fi
          python -m pregame.sportsbooks "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Commit lines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pregame/direct_lines
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "direct lines: FanDuel/DraftKings $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull -q --no-rebase --no-edit origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 7; done
          exit 1
