name: NFL SportsDataverse public source live parity

on:
  push:
    branches: [research/nfl-provider-connectors-2026]
    paths: ['research/nfl_sportsdataverse_source_probe.py','test_nfl_sportsdataverse_source_probe.py','.github/workflows/nfl-sportsdataverse-source-parity.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify football-only source validation rules offline
        run: python -m unittest -v test_nfl_sportsdataverse_source_probe.py
      - name: Install optional SportsDataverse beta in isolated research job
        run: python -m pip install --disable-pip-version-check -r requirements-nfl-external-research.txt
      - name: Read public nflverse 2026 NFL weekly player-stat release and compare against Sunday final gamebooks
        run: python -m research.nfl_sportsdataverse_source_probe
      - name: Save source status without secrets or modified production data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/NFL_SPORTSDATAVERSE_SOURCE_STATUS_20261109.json
          if ! git diff --cached --quiet; then
            git commit -m "research: audit SportsDataverse Sunday NFL source parity"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
