name: Bengals-Falcons live tracker

on:
  schedule:
    # Game-day window in UTC; script also has a 2026-11-08 guard and stops after final.
    - cron: '*/15 14-19 8 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cin-atl-live-tracker
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect live game snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/track_cin_atl_live.py
      - name: Commit updated live tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/week9_930/live
          if git diff --cached --quiet; then
            echo "No tracker changes to commit"
            exit 0
          fi
          git commit -m "Track live Bengals-Falcons game"
          git push
