name: NFL season data (game books, season context database, audit)

# Weekly after Monday night: refresh nflverse 2026 data, fetch any missing NFL game books, rebuild the season context
# database (research/season_context_2026/) and its completeness audit, then commit. Flags are printed in the run summary.

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Game book weeks to fetch, e.g. 1-10 (blank = every completed week)"
        required: false
  push:
    paths: ["data/gamebooks/fetch_gamebooks.py", "research/season_context_2026/build.py", ".github/workflows/nfl-season-data.yml"]
  schedule:
    - cron: "0 12 * * 2"     # Tuesday ~7 AM ET
    - cron: "0 12 * * 3"     # Wednesday retry (nflverse sometimes posts late)

permissions:
  contents: write

concurrency:
  group: nfl-season-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Refresh nflverse 2026 data
        run: python -c "from pathlib import Path; from pregame import sources as S; print(S.fetch_all(2026, Path('pregame/.cache')))"
      - name: Fetch missing NFL game books
        continue-on-error: true
        run: |
          args=()
          if [ -n "${{ inputs.weeks }}" ]; then args+=(--weeks "${{ inputs.weeks }}"); fi
          python data/gamebooks/fetch_gamebooks.py "${args[@]}" | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the season context database and audit
        run: |
          python research/season_context_2026/build.py
          cat research/season_context_2026/AUDIT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gamebooks research/season_context_2026
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "season data: game books and context database $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull -q --no-rebase --no-edit origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 7; done
          exit 1
