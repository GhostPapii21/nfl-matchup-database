name: MNF Week 9 verified Hockenson routes and opportunity scenarios

on:
  push:
    branches: [research/wentz-2025-third-down-drive-audit]
    paths: ['research/third_down/mnf_week9_route_opportunity_scenarios.py', 'test_nfl_mnf_week9_route_opportunity.py', '.github/workflows/nfl-mnf-route-opportunity-audit.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 2026 source route selection and frozen line scenarios
        run: python -m unittest -v test_nfl_mnf_week9_route_opportunity.py
      - name: Recompute research-only four-scenario model
        run: python -m research.third_down.mnf_week9_route_opportunity_scenarios
      - name: Commit report without model weights or live prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/third_down/mnf_week9_route_opportunity_scenarios_20261109.json
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze Week9 pregame route/opportunity injury scenarios"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
