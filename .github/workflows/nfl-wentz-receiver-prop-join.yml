name: Wentz third-down sacks versus receiver prop thresholds

on:
  push:
    branches: [research/wentz-2025-third-down-drive-audit]
    paths:
      - 'research/third_down/wentz_third_down_receiver_prop_join.py'
      - 'test_nfl_wentz_receiver_prop_join.py'
      - '.github/workflows/nfl-wentz-receiver-prop-join.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify third-down/prop threshold join
        run: python -m unittest -v test_nfl_wentz_receiver_prop_join.py
      - name: Generate frozen pregame historical receiver comparison
        run: python -m research.third_down.wentz_third_down_receiver_prop_join
      - name: Save research output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/third_down/wentz_third_down_jefferson_hockenson_props_20261109.json
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze Wentz sack exposure and receiver prop thresholds"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
