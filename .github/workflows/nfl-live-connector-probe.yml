name: Verify NFL live connector access without publishing credentials

on:
  push:
    branches: [research/nfl-provider-connectors-2026]
    paths: ['research/nfl_live_connector_probe.py','.github/workflows/nfl-live-connector-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NFL_BDL_API_KEY: ${{ secrets.NFL_BDL_API_KEY }}
      NFL_API_SPORTS_KEY: ${{ secrets.NFL_API_SPORTS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline provider boundaries
        run: python -m unittest -v test_nfl_external_sources.py
      - name: Attempt authorized read-only NFL provider games query or mark missing credentials
        run: python -m research.nfl_live_connector_probe
      - name: Save status only, no tokens or provider payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/NFL_LIVE_CONNECTOR_STATUS_20261109.json
          if ! git diff --cached --quiet; then
            git commit -m "research: record authorized NFL provider availability only"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
