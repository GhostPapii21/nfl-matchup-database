name: Offline test suites

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements-test.txt"
      - "scripts/test_offline.sh"
      - ".github/workflows/offline-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run offline suites (no network, no data fetch)
        run: bash scripts/test_offline.sh
