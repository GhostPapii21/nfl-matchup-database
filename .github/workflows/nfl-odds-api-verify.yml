name: Verify NFL Odds API credentials and quote freshness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate verifier offline
        run: python -m unittest -v test_nfl_odds_api_verify
      - name: Probe NFL odds without storing credentials or provider payloads
        run: python -m research.nfl_odds_api_verify
