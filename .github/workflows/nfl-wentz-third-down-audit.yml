name: NFL QB third-down and drive research audit

on:
  push:
    branches: [research/wentz-2025-third-down-drive-audit]
    paths:
      - 'research/third_down/**'
      - 'test_nfl_wentz_third_down.py'
      - '.github/workflows/nfl-wentz-third-down-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test third-down definitions without network
        run: python -m unittest -v test_nfl_wentz_third_down.py
      - name: Retrieve nflverse PBP and calculate 2025 Wentz / 2026 Bills Vikings opportunities
        run: python -m research.third_down.wentz_2025_third_down_audit
      - name: Save research-only audited JSON to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/third_down/wentz_2025_third_down_audit_20261109.json
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze Wentz 2025 third-down and 2026 offense-drive metrics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
