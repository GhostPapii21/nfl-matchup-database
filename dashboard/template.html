<title>NFL Game Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a slate rail of game chips (left on desktop, a scroller on phones) and one game sheet with a
   direction switch (who has the ball) and tabs. Field hash marks run under the header. */
/* One visual world: a night stadium seen through a holographic HUD. Dark only, by design. */
:root {
  --bg: #050a14; --surface: rgba(12, 22, 40, .78); --surface-2: rgba(20, 34, 60, .72); --ink: #e6f1ff; --muted: #8ea3c2; --line: rgba(80, 140, 220, .22);
  --accent: #22d3ee; --accent-2: #c084fc; --accent-ink: #03141b; --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --good: #34d399; --good-soft: rgba(52, 211, 153, .14); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .14); --bad: #fb7185; --bad-soft: rgba(251, 113, 133, .15);
  --chart: #38bdf8; --chart-soft: color-mix(in srgb, var(--chart) 16%, transparent); --turf: #06142a; --turf-line: #12335c;
  --ta: #22d3ee; --tb: #c084fc;
  --font-display: "Chakra Petch", "Rajdhani", "Arial Narrow", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0;
  font-variant-numeric: tabular-nums;
  background-image: radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 60%), radial-gradient(900px 500px at 0% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
    linear-gradient(color-mix(in srgb, var(--chart) 4%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--chart) 4%, transparent) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px; background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #050a14; }
a { color: var(--chart); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { background: rgba(5, 10, 20, .86); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand span { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
.meta { color: var(--muted); font-size: 12px; }
.flag-research { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.hash { height: 6px; opacity: .8; background:
  repeating-linear-gradient(90deg, transparent 0 22px, var(--line) 22px 24px) top/100% 3px no-repeat,
  repeating-linear-gradient(90deg, transparent 0 22px, var(--line) 22px 24px) bottom/100% 3px no-repeat; }

/* shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; padding-block: 16px 40px; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* slate rail */
.rail { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 90px); overflow: auto; padding-right: 2px; }
.rail h3 { font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.rail .group { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 860px) {
  .rail { position: static; max-height: none; flex-direction: row; overflow-x: auto; gap: 10px; padding-bottom: 6px; }
  .rail .group { flex-direction: row; gap: 8px; }
  .rail .group h3 { writing-mode: vertical-rl; transform: rotate(180deg); margin: 0; font-size: 11px; }
}
.chip-game { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 8px 10px; cursor: pointer; min-width: 190px; }
.chip-game:hover { border-color: var(--muted); }
.chip-game { background: linear-gradient(90deg, var(--ca, transparent) 0 4px, var(--surface) 4px calc(100% - 4px), var(--cb, transparent) calc(100% - 4px)); }
.chip-game[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.chip-game .teams { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; line-height: 1.1; }
.chip-game .when { color: var(--muted); font-size: 12px; text-align: right; }
.chip-game .line { color: var(--muted); font-size: 12px; grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.unknown { background: var(--line); }

/* game sheet */
.sheet { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.scoreboard { background: linear-gradient(100deg, color-mix(in srgb, var(--ta) 38%, transparent), rgba(5, 10, 20, .55) 38%, rgba(5, 10, 20, .55) 62%, color-mix(in srgb, var(--tb) 38%, transparent)), url("__FIELD_IMG__") center/cover, #06142a;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--r); overflow: hidden; box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 12%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent-2) 12%, transparent) inset;
  clip-path: polygon(0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px)); }
.sb-strip, .flags { background: rgba(5, 10, 20, .55); }
.sb-main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px 18px 12px; }
.team { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.team.home { text-align: right; align-items: flex-end; }
.team .abbr { font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: .9; letter-spacing: .03em; color: #fff; text-shadow: 0 0 18px var(--ta), 0 0 2px #fff; }
.team.home .abbr { text-shadow: 0 0 18px var(--tb), 0 0 2px #fff; }
.team .name, .team .qb, .vs .kick { color: #c9d7ee; }
.team .name { color: var(--muted); font-size: 13px; }
.team .qb { font-size: 12px; color: var(--muted); }
.vs { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.vs .at { font-family: var(--font-display); font-size: 22px; color: var(--muted); font-weight: 600; }
.vs .kick { font-size: 12px; color: var(--muted); white-space: nowrap; }
.vs .final { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
.sb-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--line); }
.sb-strip > div { padding: 10px 14px; border-right: 1px solid var(--line); min-width: 0; }
.sb-strip > div:last-child { border-right: 0; }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.v { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.v small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500;
  background: var(--surface); border: 1px solid var(--line); }
.pill.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.pill.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.pill.info { background: var(--chart-soft); border-color: transparent; color: var(--chart); }

.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 50%, transparent); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 9px 12px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px;
  backdrop-filter: blur(6px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 4%, transparent) inset, 0 10px 30px rgba(0, 0, 0, .35); }
.card h4 { color: var(--ink); text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 25%, transparent); }
.card h4 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.card .sub { color: var(--muted); font-size: 12px; margin-top: -6px; }
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; margin: 6px 0 -4px; }
.note { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-style: italic; }

.statrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.statrow .lab { color: var(--muted); }
.statrow .val { font-weight: 600; text-align: right; }
.rank { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.rank.good { background: var(--good-soft); color: var(--good); } .rank.bad { background: var(--bad-soft); color: var(--bad); } .rank.mid { background: var(--surface-2); color: var(--muted); }

.bar { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--chart); border-radius: 4px; }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.vsrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 12px; }
.vsrow .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vsrow .num { text-align: right; font-weight: 600; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, .tl { text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr.hl td { background: var(--good-soft); }
tr.lo td { color: var(--muted); }

.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 4px; padding: 2px 6px; background: var(--surface-2); color: var(--ink); }
.tag.t-primary { background: var(--accent); color: var(--accent-ink); }
.tag.t-red-zone-1, .tag.t-goal-line-back { background: var(--bad-soft); color: var(--bad); }
.tag.t-volume, .tag.t-lead-back, .tag.t-most-on-field { background: var(--chart-soft); color: var(--chart); }
.tag.t-boom-bust, .tag.t-deep-threat { background: var(--warn-soft); color: var(--warn); }
.tag.t-steady, .tag.t-possession, .tag.t-rising { background: var(--good-soft); color: var(--good); }
.tag.t-falling { background: var(--bad-soft); color: var(--bad); }
.tag.g-target { background: var(--good-soft); color: var(--good); } .tag.g-avoid { background: var(--bad-soft); color: var(--bad); }

.player-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.player-head .nm { font-weight: 700; font-size: 15px; }
.player-head .pos { color: var(--muted); font-size: 12px; font-weight: 600; }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.nums div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.nums .v { font-size: 19px; }
.spark { width: 100%; height: 46px; display: block; }
.spark text { fill: var(--muted); font-size: 9px; font-family: var(--font-body); }

.banner { border-radius: var(--r); padding: 12px 14px; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
.banner.good { background: var(--good-soft); color: var(--good); } .banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); } .banner.unknown { background: var(--surface-2); color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 8px; align-items: flex-start; }
.list li .dot { margin-top: 6px; }
.inj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.inj:last-child { border-bottom: 0; }
.inj .nm { font-weight: 600; }
.inj .c { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.qline { display: grid; grid-template-columns: 1.4fr repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.qline.h { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.qline span:not(:first-child) { text-align: right; }
textarea { width: 100%; min-height: 360px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r); padding: 12px; resize: vertical; }
.btn { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); text-decoration: none; display: inline-block; }
.chance { display: grid; grid-template-columns: 70px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 12px; }
.chance .bar { height: 10px; }
.chance .bar i { background: var(--accent); }
.chance.hl .lab2 { font-weight: 700; color: var(--ink); }
.chance .lab2 { color: var(--muted); }
.chance .num { text-align: right; font-weight: 600; }
.big { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
.flow { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.flow .arrow { color: var(--muted); }
[hidden] { display: none !important; }
.fieldsvg { width: 100%; height: auto; display: block; border-radius: 8px; }
.fieldsvg.wide { max-width: 620px; margin: 0 auto; }
.fieldsvg text { font-family: var(--font-body); }
.edge-card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.ribbon { align-self: flex-start; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; font-size: 13px; padding: 2px 10px; border-radius: 4px; text-transform: uppercase; }
.viz-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.viz-row > div { min-width: 0; }
.simbox { background: var(--surface-2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.simbox .seg button { padding: 4px 10px; font-size: 12px; }
.simstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.simstats div { background: var(--surface); border-radius: 6px; padding: 6px 8px; }
/* ---- skins: three looks from the Higgsfield concepts. Neon Grid (default), Chrome & Gold, Hologram HUD. */
:root[data-skin="chrome"] {
  --bg: #0a0a0d; --surface: rgba(26, 26, 32, .86); --surface-2: rgba(40, 40, 48, .8); --ink: #f4f4f5; --muted: #a1a1aa; --line: rgba(255, 255, 255, .13);
  --accent: #f5c451; --accent-2: #e5484d; --accent-ink: #1a1203; --accent-soft: rgba(245, 196, 81, .14);
  --chart: #d4d4d8; --chart-soft: rgba(212, 212, 216, .12); --turf: #121216; --turf-line: #2a2a33;
  --font-display: "Chakra Petch", "Arial Narrow", sans-serif; }
:root[data-skin="hud"] {
  --bg: #020a09; --surface: rgba(5, 24, 22, .8); --surface-2: rgba(8, 36, 33, .75); --ink: #d9fff7; --muted: #7fb3aa; --line: rgba(45, 212, 191, .24);
  --accent: #2dd4bf; --accent-2: #f59e0b; --accent-ink: #02110f; --accent-soft: rgba(45, 212, 191, .14);
  --chart: #5eead4; --chart-soft: rgba(94, 234, 212, .12); --turf: #04110f; --turf-line: #0f3b34;
  --good: #4ade80; --font-display: "Share Tech Mono", "Chakra Petch", ui-monospace, monospace; }
:root[data-skin="hud"] body { background-image: repeating-linear-gradient(0deg, rgba(45, 212, 191, .035) 0 1px, transparent 1px 3px), radial-gradient(900px 500px at 50% -10%, rgba(45, 212, 191, .10), transparent 60%); background-size: auto; }
:root[data-skin="chrome"] body { background-image: radial-gradient(900px 420px at 15% -10%, rgba(255, 255, 255, .10), transparent 60%), radial-gradient(900px 420px at 85% -10%, rgba(245, 196, 81, .10), transparent 60%); background-size: auto; }
.skins { display: inline-flex; gap: 6px; align-items: center; }
.skins button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.skins button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
.skins i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

/* ---- player card v2 */
.pgrid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.pcard { --tc: var(--accent); position: relative; padding: 2px; min-width: 0;
  clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);
  background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 30%, transparent) 30%, transparent 50%, color-mix(in srgb, var(--accent-2) 40%, transparent) 75%, var(--accent-2));
  filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 35%, transparent)); }
:root[data-skin="chrome"] .pcard { background: linear-gradient(135deg, #f4f4f5, #71717a 18%, #e4e4e7 34%, var(--tc) 50%, #52525b 66%, #f5c451 82%, #a1a1aa); filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
:root[data-skin="hud"] .pcard { background: color-mix(in srgb, var(--accent) 45%, transparent); filter: none; }
.pcard.hot { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 80%, transparent)); }
.pc-in { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 22%, #070d18), #060b16 45%); clip-path: inherit; padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100%; position: relative; }
:root[data-skin="chrome"] .pc-in { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 30%, #141418), #0e0e12 50%); }
:root[data-skin="hud"] .pc-in { background: linear-gradient(180deg, rgba(5, 30, 27, .92), rgba(2, 12, 11, .96)); }
:root[data-skin="hud"] .pc-in::before, :root[data-skin="hud"] .pc-in::after { content: ""; position: absolute; width: 22px; height: 22px; border: 2px solid var(--accent-2); pointer-events: none; }
:root[data-skin="hud"] .pc-in::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }

  const ord = (k) => { const s = ["th", "st", "nd", "rd"], v = k % 100; return k + (s[(v - 20) % 10] || s[v] || s[0]); };
  const american = (p) => isNum(p) ? (p > 0 ? "+" + p : String(p)) : "–";

  const BOOK = { pinnacle: "Pinnacle", draftkings: "DraftKings", fanduel: "FanDuel", hardrockbet: "Hard Rock", williamhill_us: "Caesars", caesars: "Caesars" };

    xs.forEach((v, i) => { if (v == null) return; d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); });
    const firstI = xs.findIndex((v) => v != null), lastI = xs.length - 1 - [...xs].reverse().findIndex((v) => v != null);
    a = d + `L${X(lastI).toFixed(1)} ${h - bot}L${X(firstI).toFixed(1)} ${h - bot}Z`;
    const avgLine = isNum(avg) ? `<line x1="${pad}" x2="${w - pad}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>` : "";
    const dots = xs.map((v, i) => v == null ? "" : `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i === lastI ? 3.2 : 2}" fill="${i === lastI ? "var(--accent)" : "var(--chart)"}"><title>${esc((labels[i] || "") + ": " + fmt(v))}</title></circle>`).join("");
    const lab = xs.map((v, i) => (i === firstI || i === lastI) && labels[i] ? `<text x="${X(i).toFixed(1)}" y="${h - 1}" text-anchor="${i === firstI ? "start" : "end"}">${esc(labels[i])}</text>` : "").join("");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="trend"><path d="${a}" fill="var(--chart-soft)" stroke="none"/>${avgLine}<path d="${d}" fill="none" stroke="var(--chart)" stroke-width="1.8"/>${dots}${lab}</svg>`;

  }
  const tagHtml = (t) => `<button type="button" class="tag t-${slug(t.tag)}" data-gloss="${slug(t.tag)}" title="${esc(t.why || "")}">${esc(t.tag)}</button>`;

  // ---------------------------------------------------------------- scoreboard header

    if (!isFinal(g) && g.game.kickoff_et) { const [kh, km] = g.game.kickoff_et.split(":").map(Number); const mins = kh * 60 + km - 90, ih = Math.floor(mins / 60), im = mins % 60;

      <div class="sb-main">
        <div class="team"><span class="abbr">${esc(a)}</span><span class="name">${esc(g.teams[a].name)}</span><span class="qb">QB ${esc((g.game.listed_qbs || {})[a] || "unknown")}</span></div>

  // ---------------------------------------------------------------- overview
  function edgeClass(e, s) {
    const t = (e.edge || "").toUpperCase();

  }
  function edgesCard(s) {
    const es = s.edges || [];

    return `<div class="card"><h4>${esc(s.offense)} offense vs ${esc(s.defense)} defense</h4><div class="sub">Where the ranks line up. 1 = best at its own job.</div>
      <ul class="list">${es.map((e) => `<li>${lvlDot(edgeClass(e, s))}<div><b>${esc(e.area)}</b>: ${esc(e.edge.toLowerCase())}<div class="note">${esc(s.offense)} ${ord(e.offense_rank)} (${n(e.offense_value, e.is_rate ? 3 : 1)}), ${esc(s.defense)} ${ord(e.defense_rank)} (${n(e.defense_value, e.is_rate ? 3 : 1)}), league ${n(e.league_avg, e.is_rate ? 3 : 1)}</div></div></li>`).join("")}</ul></div>`;
  }
  function topReceiversCard(s) {
    const rec = ((s.roles || {}).receivers || []).slice(0, 4);

  }
  function targetsCard(s) {

  }
  function lastMeetingCard(g) {

  function quartersCard(g) {

    const row = (t, k, lab) => `<tr><td>${esc(t)} ${lab}</td>${Q(t)[k].map((v) => `<td>${n(v, 1)}</td>`).join("")}<td><b>${n(Q(t)[k === "for" ? "first_half" : "first_half"][k === "for" ? 0 : 1], 1)}</b></td><td><b>${n(Q(t).second_half[k === "for" ? 0 : 1], 1)}</b></td></tr>`;

  function rulesCard(g) {
    const items = [];
    Object.values(g.sides).forEach((s) => {
      ((s.roles || {}).rushers || []).filter((r) => r.pos === "RB" && r.carries >= 8).sort((x, y) => (y.carry_share || 0) - (x.carry_share || 0)).slice(0, 2).forEach((r) => {
        if ((r.carry_share || 0) < 0.6) items.push(["bad", `${s.offense} ${r.full_name || r.player}: ${pct(r.carry_share)} of carries. Under 60%: do not play his rushing legs.`]);
        else items.push(["good", `${s.offense} ${r.full_name || r.player}: ${pct(r.carry_share)} of carries. Passes the 60% rule.`]);
      });
      (s.offense_injuries || []).forEach((x) => {

      });

    return `<div class="card"><h4>Your rules</h4><div class="sub">The rule gates your bots apply, checked against this game</div><ul class="list">${items.map(([l, t]) => `<li>${lvlDot(l)}<span>${esc(t)}</span></li>`).join("")}</ul></div>`;
  }
  function phasesCard(g) {
    const P = g.phase_ledger || [];

    return `<div class="card"><h4>Data checklist</h4><div class="sub">The 15-phase ledger from the packet: what is filled and what is still missing</div><ul class="list">${P.map((p) => `<li>${lvlDot(lv(p.status))}<span><b>${p.phase}. ${esc(p.name)}</b> <span class="note">${esc(p.status)}${p.detail ? " · " + esc(p.detail) : ""}</span></span></li>`).join("")}</ul></div>`;
  }
  function renderOverview(g) {
    const ks = sideKeys(g), s1 = g.sides[ks[0]], s2 = g.sides[ks[1]];
    return `${oppLeadersCard(g)}<div class="grid two">${edgesCard(s1)}${edgesCard(s2)}</div>
      <div class="grid two">${topReceiversCard(s1)}${topReceiversCard(s2)}</div>
      <div class="grid two">${targetsCard(s1)}${targetsCard(s2)}</div>
      <div class="grid two">${qbQuickCard(s1)}${qbQuickCard(s2)}</div>
      <div class="grid two">${injSummaryCard(g)}${lastMeetingCard(g)}</div>
      <div class="grid two">${scriptCard(g)}${rulesCard(g)}</div>

      ${phasesCard(g)}`;
  }

  // ---------------------------------------------------------------- matchup (what the defense allows)
  const POS = [

      <div class="grid two"><div class="card"><h4>Forecast at kickoff</h4><div class="sub">${esc(W.source || "")} · pulled ${esc((W.retrieved_utc || "").slice(0, 16).replace("T", " "))} UTC</div>
        ${W.status === "OK" ? `<div class="nums"><div><div class="k">Temp</div><div class="v">${k.temp_f ?? "–"}°</div></div><div><div class="k">Wind</div><div class="v">${n(k.wind_mph, 0)} <small>${esc(k.wind_dir || "")}</small></div></div><div><div class="k">Rain</div><div class="v">${k.precip_chance_pct ?? "–"}%</div></div><div><div class="k">Sky</div><div class="v" style="font-size:15px">${esc(k.summary || "")}</div></div></div>
        <div class="statrow"><span class="lab">During the game</span><span class="val">low ${dg.temp_f_min ?? "–"}°, wind up to ${n(dg.wind_mph_max, 0)} mph, rain up to ${dg.precip_chance_pct_max ?? "–"}%</span></div>` : `<p class="empty">${esc(W.status || "Not available")}</p>`}</div>
      ${ctx.map(([t, c]) => `<div class="card"><h4>${esc(t)} rest and travel</h4><div class="statrow"><span class="lab">Days of rest</span><span class="val">${c.rest_days ?? "–"}</span>
        ${c.last_game ? `<span class="lab">Last game</span><span class="val" style="white-space:normal">Week ${c.last_game.week} ${esc(c.last_game.weekday)}, ${c.last_game.site} vs ${esc(c.last_game.opponent)} ${c.last_game.score ? "(" + esc(c.last_game.score) + ")" : ""}</span><span class="lab">Where</span><span class="val">${esc(c.last_game.stadium)}</span>` : ""}</div>
        ${(c.flags || []).length ? `<ul class="list">${c.flags.map((f) => `<li>${lvlDot(f.level)}<span>${esc(f.text)}</span></li>`).join("")}</ul>` : '<p class="note">No rest or travel flags.</p>'}</div>`).join("")}</div>
      <div class="grid two">${rainTbl(g.sides[ks[0]])}${rainTbl(g.sides[ks[1]])}</div>`;
  }

  // ---------------------------------------------------------------- copy for grok
  function grokText(g) {
    const L = [], a = g.game.away, h = g.game.home, m = g.market || {};
    L.push(`Analyze ${a} at ${h} (${g.game.slot}, ${kickLabel(g)}). Use pregame/ANALYST_PROMPT.md in GhostPapii21/nfl-matchup-database, and dashboard/data/${g.game.game_id}.json for everything below.`);
    L.push(`Packet built ${g.generated_utc}. Research only; projection_ready is false.`, "");
    L.push(`Market: ${h} ${signed(m.home_spread, 1)}, total ${n(m.total, 1)}, ML ${a} ${american((m.moneyline || {})[a])} / ${h} ${american((m.moneyline || {})[h])}.`);
    L.push(`Weather: ${(g.weather_verdict || {}).headline || "n/a"}`);
    Object.entries(g.context || {}).forEach(([t, c]) => (c.flags || []).forEach((f) => L.push(`${t}: ${f.text}`)));
    Object.values(g.sides).forEach((s) => {
      const da = s.defense_allowed || {}, dr = s.defense_rank || {};
      const rk = (k) => dr[k] ? ` (${ord(dr[k].rank)})` : "";
      L.push("", `## ${s.offense} offense vs ${s.defense} defense`);
      L.push(`${s.defense} allows per game: WR ${n(da.wr_receptions_pg, 1)} rec / ${n(da.wr_rec_yards_pg, 1)} yds${rk("wr_rec_yards_pg")}, TE ${n(da.te_receptions_pg, 1)} / ${n(da.te_rec_yards_pg, 1)}${rk("te_rec_yards_pg")}, RB rush ${n(da.rb_rush_yards_pg, 1)}${rk("rb_rush_yards_pg")}, RB rec ${n(da.rb_rec_yards_pg, 1)}${rk("rb_rec_yards_pg")}. Blitz ${pct(da.blitz_rate)}, pressure ${pct(da.pressure_rate)}, red-zone TD ${pct(da.red_zone_td_rate)}.`);
      (s.edges || []).forEach((e) => L.push(`- Edge: ${e.area}: ${e.edge.toLowerCase()} (${s.offense} ${ord(e.offense_rank)}, ${s.defense} ${ord(e.defense_rank)})`));
      const tg = ((s.defenders || {}).coverage || []).filter((c) => c.grade === "target");
      if (tg.length) L.push(`Defenders to attack: ${tg.map((c) => `${c.player} ${c.position} (${c.why.join(", ")})`).join("; ")}`);
      const q = s.qb || {}, c = q.this_season || {};
      if (c.all) L.push(`QB ${q.player}: ${n(c.all.yards_per_attempt, 2)} YPA, vs blitz ${n((c.vs_blitz || {}).yards_per_attempt, 2)}, no blitz ${n((c.no_blitz || {}).yards_per_attempt, 2)}, pressured ${pct((c.pressured || {}).pressure_rate)}; red zone ${(c.red_zone || {}).td} TD on ${(c.red_zone || {}).attempts} att.`);
      if (q.last_season && q.last_season.vs_man) L.push(`QB ${q.last_season.season}: vs man ${n(q.last_season.vs_man.yards_per_attempt, 2)} YPA, vs zone ${n(q.last_season.vs_zone.yards_per_attempt, 2)}, under pressure ${n((q.last_season.pressured || {}).yards_per_attempt, 2)}.`);
      if (s.coverage_profile) L.push(`${s.defense} coverage ${s.coverage_profile.season}: ${pct(s.coverage_profile.zone_rate)} zone, shells ${(s.coverage_profile.shells || []).map((x) => x.shell + " " + pct(x.rate)).join(", ")}.`);
      ((s.roles || {}).receivers || []).slice(0, 5).forEach((r) => L.push(`- ${r.full_name || r.player} ${r.pos}: ${pct(r.target_share)} tgt share, ${n(r.targets_pg, 1)} tgt/g, ${n(r.yards_pg, 0)} yds/g, aDOT ${n(r.avg_depth_of_target, 1)}, RZ tgt ${r.red_zone_targets}. Roles: ${(r.tags || []).map((t) => t.tag).join(", ") || "none"}.`));
      ((s.roles || {}).rushers || []).slice(0, 3).forEach((r) => L.push(`- ${r.full_name || r.player} ${r.pos}: ${pct(r.carry_share)} of carries, ${n(r.yards_pg, 0)} yds/g, ${n(r.yards_per_carry, 2)} YPC, RZ carries ${r.red_zone_carries}. Roles: ${(r.tags || []).map((t) => t.tag).join(", ") || "none"}.`));
      const o = s.opportunity;
      if (o && !o.error) { L.push(`Volume this game: ${n(o.team_pass_attempts, 1)} pass attempts, ${n(o.team_rush_attempts, 1)} rush attempts (implied margin ${signed(o.implied_margin, 1)}).`);
        (o.receivers || []).filter((r) => !r.status).slice(0, 5).forEach((r) => L.push(`- Opportunity ${r.player}: ${n(r.targets_mean, 1)} targets, median ${n(r.yards_median, 0)} yds, 70+ ${pct((r.yards || {})["70"])}, 80+ ${pct((r.yards || {})["80"])}, needs ${(r.targets_needed || {})["70"]} targets for 70.`));
        (o.rushers || []).filter((r) => !r.status).slice(0, 3).forEach((r) => L.push(`- Opportunity ${r.player}: ${n(r.carries_mean, 1)} carries, median ${n(r.yards_median, 0)} rush yds, 70+ ${pct((r.yards || {})["70"])}.`)); }
      const inj = (s.offense_injuries || []).filter((x) => x.status_level >= 2 && x.impact !== "low");
      if (inj.length) L.push(`${s.offense} injuries: ${inj.map((x) => `${x.player} ${x.position} ${x.game_status || x.espn || ""}${x.next_up ? " (next: " + x.next_up + ")" : ""}`).join("; ")}`);
      (s.returning || []).forEach((r) => L.push(`${s.offense} back from injury: ${r.player} ${r.position}, ${pct(r.snap_pct_before)} snaps before, ${pct(r.snap_pct_last_game)} last game (${r.status}).`));
    });
    const H = g.h2h && g.h2h.last;
    if (H) { L.push("", `## Last meeting: ${H.score} (${H.date})`); (H.carryover || []).forEach((c) => L.push(`- ${c.text}`)); }
    L.push("", "Run the six layers (research, opportunity, brainstorm, critical review, market, value). No invented numbers. Research only.");
    return L.join("\n");
  }
  function renderGrok(g) {
    return `<div class="card"><h4>One paste for Grok or ChatGPT</h4><div class="sub">Everything on this board for ${esc(g.game.away)} at ${esc(g.game.home)}, plus the instruction to run your analyst prompt.</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="copy">Copy</button><span class="toast" id="copied" hidden>Copied</span></div>
      <label for="grok-text" class="k">Text to paste</label><textarea id="grok-text" readonly>${esc(grokText(g))}</textarea></div>`;
  }

  // ---------------------------------------------------------------- page
  function renderSheet() {
    const g = G();
    if (!g) { document.getElementById("sheet").innerHTML = `<div class="card"><p class="empty">No games on the board yet. Packets are built Tuesday morning for the week.</p></div>`; return; }
    const ks = sideKeys(g);
    const dirNeeded = ["matchup", "defenders", "qb", "players", "opportunity", "field"].includes(state.tab);
    const dirBtns = ks.map((k, i) => { const s = g.sides[k]; return `<button aria-pressed="${i === state.dir}" data-dir="${i}">${esc(s.offense)} offense vs ${esc(s.defense)} defense</button>`; }).join("");
    const body = { overview: renderOverview, matchup: renderMatchup, defenders: renderDefenders, qb: renderQB, players: renderPlayers, opportunity: renderOpportunity, field: renderField, injuries: renderInjuries,
                   h2h: renderH2H, odds: renderOdds, weather: renderWeather, grok: renderGrok }[state.tab](g);
    const sh = document.getElementById("sheet"); sh.style.setProperty("--ta", teamColor(g, g.game.away)); sh.style.setProperty("--tb", teamColor(g, g.game.home));
    document.getElementById("sheet").innerHTML = renderHeader(g) +
      `<div class="tabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" class="${FEATURE.has(k) ? "feature" : ""}" aria-selected="${k === state.tab}" data-tab="${k}">${esc(l)}</button>`).join("")}</div>` +
      (dirNeeded ? `<div class="controls"><div class="seg" role="group" aria-label="Which offense">${dirBtns}</div></div>` : "") + body;
    document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.tab; save(); renderSheet(); }));
    document.querySelectorAll("[data-dir]").forEach((b) => b.addEventListener("click", () => { state.dir = +b.dataset.dir; renderSheet(); }));
    document.querySelectorAll("[data-sim]").forEach((b) => b.addEventListener("click", () => runSim(b.dataset.sim, "exp")));
    initCards();
    document.querySelectorAll("[data-tour]").forEach((b) => b.addEventListener("click", startTour));
    document.querySelectorAll("[data-glossary]").forEach((b) => b.addEventListener("click", openGlossary));
    if (state.tab === "players" && tourI < 0) { let done = null; try { done = localStorage.getItem("board-tour-cards"); } catch (e) { /* storage blocked */ } if (!done && !knowBall() && document.getElementById("howto").hidden) setTimeout(startTour, 500); }
    const cp = document.getElementById("copy");
    if (cp) cp.addEventListener("click", () => {
      const ta = document.getElementById("grok-text");
      const ok = () => { const t = document.getElementById("copied"); t.hidden = false; setTimeout(() => (t.hidden = true), 1800); };
      try { navigator.clipboard.writeText(ta.value).then(ok, () => { ta.focus(); ta.select(); }); } catch (e) { ta.focus(); ta.select(); }
    });
  }
  function save() { try { localStorage.setItem("board-tab", state.tab); } catch (e) { /* storage blocked */ } }
  function fromHash() {
    const h = location.hash.slice(1).toUpperCase();
    const i = games.findIndex((g) => `${g.game.away}-${g.game.home}` === h);
    if (i >= 0) { state.gi = i; state.view = "game"; } else state.view = "home";
  }
  const knowBall = () => document.documentElement.getAttribute("data-knowball") === "1";
  function setKnowBall(on, announce) {
    document.documentElement.setAttribute("data-knowball", on ? "1" : "0");
    const b = document.getElementById("kb-btn"); if (b) { b.setAttribute("aria-pressed", on); b.title = on ? "Know Ball Mode is on: tap to bring the tutorials back" : "Turn tutorials and hints off"; }
    try { localStorage.setItem("board-knowball", on ? "1" : "0"); } catch (e) { /* storage blocked */ }
    if (on) { if (tourI >= 0) endTour(); closeHelp(); hideGloss(); }
    if (announce) {
      let t = document.getElementById("kb-toast"); if (!t) { t = document.createElement("div"); t.id = "kb-toast"; t.className = "kb-toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
      t.textContent = on ? "🏈 Know Ball Mode on: tutorials, ? marks and the help bubble are hidden. Tap the button again to bring them back." : "Tutorials and hints are back.";
      t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 3500);
    }
  }
  function setSkin(k) { document.documentElement.setAttribute("data-skin", k); document.querySelectorAll("#skins button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.skin === k)); try { localStorage.setItem("board-skin", k); } catch (e) { /* storage blocked */ } }
  let skin0 = "neon"; try { skin0 = localStorage.getItem("board-skin") || "neon"; } catch (e) { /* storage blocked */ }
  setSkin(skin0);
  document.querySelectorAll("#skins button").forEach((b) => b.addEventListener("click", () => setSkin(b.dataset.skin)));
  try { const t = localStorage.getItem("board-tab"); if (t && TABS.some(([k]) => k === t)) state.tab = t; } catch (e) { /* storage blocked */ }
  const built = BOARD && BOARD.built_utc ? new Date(BOARD.built_utc) : null;
  document.getElementById("meta").textContent = games.length ? `Week ${games[0].game.week} · ${games.length} games · updated ${built ? built.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "?"}` : "No games";
  document.getElementById("foot").innerHTML = `Data: nflverse play-by-play, FTN charting, NGS participation (last season), Pro Football Reference, the official injury report and ESPN, the National Weather Service, and The Odds API. Built from GhostPapii21/nfl-matchup-database. Research only: no number here is a validated projection or a bet recommendation.`;
  let kb0 = false; try { kb0 = localStorage.getItem("board-knowball") === "1"; } catch (e) { /* storage blocked */ }
  setKnowBall(kb0, false);
  document.getElementById("kb-btn").addEventListener("click", () => setKnowBall(!knowBall(), true));
  document.querySelectorAll("header [data-howto]").forEach((b) => b.addEventListener("click", openHowto));
  document.getElementById("help-fab").addEventListener("click", () => { const p = document.getElementById("help-panel"); if (p && !p.hidden) closeHelp(); else openHelp(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (tourI >= 0) endTour(); else closeHelp(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("howto").hidden) closeHowto(); });
  document.getElementById("howto").addEventListener("click", (e) => { if (e.target.id === "howto") closeHowto(); });
  fromHash(); render(false);
  let seen = null; try { seen = localStorage.getItem("board-howto"); } catch (e) { /* storage blocked */ }
  if (!seen && !knowBall() && state.view === "home" && games.length) openHowto();
  window.addEventListener("hashchange", () => { fromHash(); render(true); });
})();
</script>
